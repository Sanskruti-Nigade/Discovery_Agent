<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lineage Graph</title>
<link rel="stylesheet" href="/lib/vis-network.css">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#667085;--accent:#2563eb;--border:#e2e5ea}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--text:#e8eaed;--muted:#9aa3af;--accent:#60a5fa;--border:#2c323b}}
body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
header{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border)}header a{color:var(--accent)}
#net{flex:1;min-height:0;width:100%;height:calc(100vh - 80px)}.hint{color:var(--muted);font-size:12px}
</style></head><body>
<header><b>Lineage graph</b> &middot; <a href="/">back to Q&amp;A</a><br>
<span class="hint">Click a node to open what is inside it (system &rarr; tables &rarr; columns &rarr; data type). Opening goes one way only, so clicking a data type does not show its columns. Double-click a node to collapse it.</span></header>
<div id="net"></div>
<script src="/lib/vis-network.min.js"></script>
<script>
const nodes=new vis.DataSet(),edges=new vis.DataSet(),opened=new Set(),kids={};
const net=new vis.Network(document.getElementById('net'),{nodes,edges},{
 nodes:{shape:'dot',size:18,font:{color:getComputedStyle(document.body).color}},
 edges:{arrows:'to',font:{size:9,color:'#888',strokeWidth:0},smooth:{type:'dynamic'}},
 physics:{barnesHut:{springLength:110}}});
function add(g){g.nodes.forEach(n=>{if(!nodes.get(n.id))nodes.add(n)});
 g.edges.forEach(e=>{const id=e.from+'>'+e.label+'>'+e.to;if(!edges.get(id))edges.add({...e,id})})}
fetch('/api/graph/roots').then(r=>r.json()).then(add);
net.on('click',async p=>{if(!p.nodes.length)return;const id=p.nodes[0];if(opened.has(id))return;opened.add(id);
 const g=await(await fetch('/api/graph/expand?id='+encodeURIComponent(id))).json();kids[id]=g.nodes.map(n=>n.id);add(g)});
net.on('doubleClick',p=>{if(!p.nodes.length)return;const id=p.nodes[0];
 (function drop(i){(kids[i]||[]).forEach(k=>{drop(k);opened.delete(k);if(nodes.get(k)&&!edges.get({filter:e=>e.to===k&&e.from!==i}).length)nodes.remove(k)});delete kids[i]})(id);opened.delete(id)});
</script></body></html>
